name: Restore fixed Texas Oil Runner file

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore fixed game file from history
        run: |
          set -euo pipefail
          git show d2bdc7a:texas-oil-runner-fixed.html > texas-oil-runner.html
          SIZE=$(wc -c < texas-oil-runner.html)
          echo "Restored file size: ${SIZE} bytes"
          test "${SIZE}" -eq 5133246
          git config user.name "williammorgansmusebot"
          git config user.email "williammorgansmusebot@users.noreply.github.com"
          git add texas-oil-runner.html
          git commit -m "Restore fixed Texas Oil Runner: inline all game assets (5133246 bytes)"
          git push origin main
